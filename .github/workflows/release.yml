name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and verify closed release assets
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      evidence-run: ${{ steps.execution-run.outputs.run-id }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/devops-stack-tool-archives
          key: execution-tools-${{ runner.os }}-amd64-v1-kind-0.33.0-kubectl-1.36.4-kubeconform-0.8.0-syft-1.51.1-trivy-0.74.0-gh-2.95.0

      - name: Restore the versioned Trivy database cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-v0.74.0-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            trivy-db-${{ runner.os }}-v0.74.0-

      - name: Validate tag, version, commit, and worktree
        id: release-version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          assert match is not None, tag
          version = tag[1:]
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          assert metadata["project"]["version"] == version, metadata["project"]["version"]
          head = subprocess.run(
              ["git", "rev-parse", "--verify", "HEAD^{commit}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          tagged = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert head == tagged == os.environ["GITHUB_SHA"], (head, tagged)
          assert status == "", status
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
          PY

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . build==1.6.0 twine==7.0.0
          python -m pip check

      - name: Run the complete unit and integration suite
        run: python -m unittest discover -s tests -q

      - name: Install checksum-pinned execution tools
        run: |
          scripts/install-kind-e2e-tools.sh \
            "$RUNNER_TEMP/devops-stack-tools" \
            "$RUNNER_TEMP/devops-stack-tool-archives"
          echo "$RUNNER_TEMP/devops-stack-tools" >> "$GITHUB_PATH"

      - name: Verify and record the bounded hosted-runner Docker toolchain
        run: |
          docker_client=$(docker version --format '{{.Client.Version}}')
          docker_server=$(docker version --format '{{.Server.Version}}')
          buildx_version=$(docker buildx version | awk 'NR == 1 {print $2}')
          python - "$docker_client" "$docker_server" "$buildx_version" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          # Docker is coupled to the hosted runner daemon. Refuse unreviewed
          # major upgrades while allowing patch updates inside the reviewed range.
          docker_pattern = re.compile(r"^(?:26|27|28|29)\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
          buildx_pattern = re.compile(r"^v0\.(?:2[0-9]|3[0-6])\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
          client, server, buildx = sys.argv[1:]
          assert docker_pattern.fullmatch(client), client
          assert docker_pattern.fullmatch(server), server
          assert client.split(".", 1)[0] == server.split(".", 1)[0], (client, server)
          assert buildx_pattern.fullmatch(buildx), buildx
          value = {
              "buildx": buildx,
              "dockerClient": client,
              "dockerServer": server,
              "policy": "Docker 26-29 with matching majors; Buildx 0.20-0.36",
          }
          rendered = json.dumps(value, indent=2, sort_keys=True) + "\n"
          target = Path(os.environ["RUNNER_TEMP"]) / "container-tool-versions.json"
          target.write_text(rendered)
          print(rendered, end="")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Hosted runner container tools\n\n")
              stream.write(f"- Docker client: `{client}`\n")
              stream.write(f"- Docker server: `{server}`\n")
              stream.write(f"- Docker Buildx: `{buildx}`\n")
          PY

      - name: Resolve immutable templates and diagnose the release host
        run: |
          devops-stack templates list \
            --project examples/python-service \
            --json > "$RUNNER_TEMP/templates.json"
          devops-stack doctor \
            --project examples/python-service \
            --no-fetch \
            --profile kind-e2e \
            --json > "$RUNNER_TEMP/doctor.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "doctor.json").read_text())
          assert report["passed"] is True, report
          assert report["counts"]["BLOCKED_MISSING_REQUIRED_TOOL"] == 0, report["counts"]
          PY

      - name: Allocate an execution run ID
        id: execution-run
        run: |
          RUN_ID=$(python -c 'from devops_stack_composer.evidence_store import new_run_id; print(new_run_id())')
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Produce real Docker and kind evidence
        run: |
          devops-stack execute \
            --project examples/python-service \
            --no-fetch \
            --environment staging \
            --profile kind-e2e \
            --output .devops-stack/release-runs \
            --image-tag "release-${GITHUB_SHA::12}" \
            --run "$RUN_ID" \
            --json > "$RUNNER_TEMP/execution.json"
          devops-stack artifact verify \
            --project examples/python-service \
            --run "$RUN_ID" \
            --output .devops-stack/release-runs \
            --json > "$RUNNER_TEMP/evidence-verification.json"

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = tuple(Path("dist").glob("devops_stack_composer-*.whl"))
          sdist = tuple(Path("dist").glob("devops_stack_composer-*.tar.gz"))
          assert len(wheel) == len(sdist) == 1, (wheel, sdist)
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
          assert any(name.endswith("/METADATA") for name in names), names
          with tarfile.open(sdist[0], "r:gz") as archive:
              names = archive.getnames()
          assert any(name.endswith("/PKG-INFO") for name in names), names
          assert not any(
              "/examples/python-service/build/" in name or name.endswith(".pyz")
              for name in names
          ), names
          PY

      - name: Assemble and offline-verify the release set
        run: |
          devops-stack release materials \
            --project . \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --output dist/release-materials \
            --json > "$RUNNER_TEMP/release-materials.json"
          devops-stack release assemble \
            --project . \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --materials dist/release-materials \
            --evidence-run "$RUN_ID" \
            --evidence-output examples/python-service/.devops-stack/release-runs \
            --output "dist/release-${GITHUB_REF_NAME}" \
            --json > "$RUNNER_TEMP/release-assembly.json"
          devops-stack release verify \
            --project . \
            --directory "dist/release-${GITHUB_REF_NAME}" \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --json > "$RUNNER_TEMP/release-verification.json"
          python -m json.tool "$RUNNER_TEMP/release-verification.json"

      - name: Isolated-install the locally verified release distributions
        run: |
          python scripts/verify-release-distributions.py \
            "dist/release-${GITHUB_REF_NAME}" \
            "${GITHUB_REF_NAME#v}" \
            "$GITHUB_SHA" \
            > "$RUNNER_TEMP/local-release-install-verification.json"

      - name: Retry exact owned-resource cleanup
        if: ${{ always() }}
        run: |
          run_directory="examples/python-service/.devops-stack/release-runs/${RUN_ID:-}"
          if [[ -n "${RUN_ID:-}" && -d "$run_directory" ]]; then
            devops-stack execution cleanup \
              --project examples/python-service \
              --run "$RUN_ID" \
              --output .devops-stack/release-runs \
              --json
          fi

      - name: Upload release-build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            examples/python-service/.devops-stack/release-runs/${{ env.RUN_ID }}
            ${{ runner.temp }}/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean Docker build cache and report disk usage
        if: ${{ always() }}
        run: |
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          docker system df

      - name: Upload the closed release set
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30

  stage-draft:
    name: Attest and stage a verified draft
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/devops-stack-tool-archives
          key: execution-tools-${{ runner.os }}-amd64-v1-kind-0.33.0-kubectl-1.36.4-kubeconform-0.8.0-syft-1.51.1-trivy-0.74.0-gh-2.95.0

      - name: Install the checksum-pinned GitHub CLI bundle
        run: |
          scripts/install-kind-e2e-tools.sh \
            "$RUNNER_TEMP/devops-stack-tools" \
            "$RUNNER_TEMP/devops-stack-tool-archives"
          echo "$RUNNER_TEMP/devops-stack-tools" >> "$GITHUB_PATH"

      - name: Download the closed set from the build job
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Inspect existing release state without mutation
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repository=${GITHUB_REPOSITORY#*/}
          gh api graphql \
            -f owner="$owner" \
            -f name="$repository" \
            -f tag="$GITHUB_REF_NAME" \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){tagName isDraft isPrerelease publishedAt}}}' \
            > "$RUNNER_TEMP/existing-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          document = json.loads((root / "existing-release.json").read_text())
          release = document["data"]["repository"]["release"]
          if release is None:
              state = "missing"
          else:
              assert release["tagName"] == os.environ["GITHUB_REF_NAME"], release
              if not release["isDraft"]:
                  raise RuntimeError("refusing to modify an existing published release")
              assert release["isPrerelease"] is False, release
              assert release["publishedAt"] is None, release
              state = "draft"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"state={state}\n")
          print(f"release state: {state}")
          PY

      - name: Generate GitHub artifact attestations
        if: ${{ steps.release-state.outputs.state == 'missing' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Stage the GitHub release as a draft
        if: ${{ steps.release-state.outputs.state == 'missing' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "DevOps Stack Composer $GITHUB_REF_NAME" \
            --generate-notes

      - name: Independently download and verify the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .devops-stack/draft-release
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .devops-stack/draft-release
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def inventory(directory):
              entries = tuple(directory.iterdir())
              assert len(entries) == 11, entries
              assert all(path.is_file() and not path.is_symlink() for path in entries), entries
              return {
                  path.name: sha256(path.read_bytes()).hexdigest()
                  for path in entries
              }

          expected = inventory(Path("release-assets"))
          downloaded = inventory(Path(".devops-stack/draft-release"))
          assert expected == downloaded, (expected, downloaded)
          PY
          for asset in .devops-stack/draft-release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --format json > /dev/null
          done
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets \
            > "$RUNNER_TEMP/draft-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "draft-release.json").read_text()
          )
          assert release["tagName"] == os.environ["GITHUB_REF_NAME"], release
          assert release["isDraft"] is True, release
          assert release["isPrerelease"] is False, release
          assert release["publishedAt"] is None, release
          assert len(release["assets"]) == 11, release
          assert {asset["name"] for asset in release["assets"]} == {
              path.name for path in Path("release-assets").iterdir()
          }, release
          PY

      - name: Upload draft-staging diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-staging-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.json
          if-no-files-found: warn
          retention-days: 30

  validate-draft:
    name: Run the cumulative release profile against the draft
    needs:
      - build-release
      - stage-draft
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/devops-stack-tool-archives
          key: execution-tools-${{ runner.os }}-amd64-v1-kind-0.33.0-kubectl-1.36.4-kubeconform-0.8.0-syft-1.51.1-trivy-0.74.0-gh-2.95.0

      - name: Restore the versioned Trivy database cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-v0.74.0-${{ github.run_id }}-${{ github.run_attempt }}-validate
          restore-keys: |
            trivy-db-${{ runner.os }}-v0.74.0-

      - name: Install package and checksum-pinned execution tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
          scripts/install-kind-e2e-tools.sh \
            "$RUNNER_TEMP/devops-stack-tools" \
            "$RUNNER_TEMP/devops-stack-tool-archives"
          echo "$RUNNER_TEMP/devops-stack-tools" >> "$GITHUB_PATH"

      - name: Verify and record the bounded hosted-runner Docker toolchain
        run: |
          docker_client=$(docker version --format '{{.Client.Version}}')
          docker_server=$(docker version --format '{{.Server.Version}}')
          buildx_version=$(docker buildx version | awk 'NR == 1 {print $2}')
          python - "$docker_client" "$docker_server" "$buildx_version" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          # Docker is coupled to the hosted runner daemon. Refuse unreviewed
          # major upgrades while allowing patch updates inside the reviewed range.
          docker_pattern = re.compile(r"^(?:26|27|28|29)\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
          buildx_pattern = re.compile(r"^v0\.(?:2[0-9]|3[0-6])\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
          client, server, buildx = sys.argv[1:]
          assert docker_pattern.fullmatch(client), client
          assert docker_pattern.fullmatch(server), server
          assert client.split(".", 1)[0] == server.split(".", 1)[0], (client, server)
          assert buildx_pattern.fullmatch(buildx), buildx
          value = {
              "buildx": buildx,
              "dockerClient": client,
              "dockerServer": server,
              "policy": "Docker 26-29 with matching majors; Buildx 0.20-0.36",
          }
          rendered = json.dumps(value, indent=2, sort_keys=True) + "\n"
          target = Path(os.environ["RUNNER_TEMP"]) / "container-tool-versions.json"
          target.write_text(rendered)
          print(rendered, end="")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Hosted runner container tools\n\n")
              stream.write(f"- Docker client: `{client}`\n")
              stream.write(f"- Docker server: `{server}`\n")
              stream.write(f"- Docker Buildx: `{buildx}`\n")
          PY

      - name: Download the local comparison set
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ github.ref_name }}
          path: examples/python-service/.devops-stack/release-${{ github.ref_name }}

      - name: Resolve immutable templates
        run: |
          devops-stack templates list \
            --project examples/python-service \
            --json > "$RUNNER_TEMP/templates.json"

      - name: Allocate a draft-validation run ID
        run: |
          RUN_ID=$(python -c 'from devops_stack_composer.evidence_store import new_run_id; print(new_run_id())')
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Execute every release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          devops-stack execute \
            --project examples/python-service \
            --no-fetch \
            --environment staging \
            --profile release \
            --output .devops-stack/draft-validation-runs \
            --image-tag "draft-${GITHUB_SHA::12}" \
            --run "$RUN_ID" \
            --release-assets ".devops-stack/release-${GITHUB_REF_NAME}" \
            --release-version "$RELEASE_VERSION" \
            --release-repository "$GITHUB_REPOSITORY" \
            --json > "$RUNNER_TEMP/draft-validation.json"
          devops-stack artifact verify \
            --project examples/python-service \
            --run "$RUN_ID" \
            --output .devops-stack/draft-validation-runs \
            --json > "$RUNNER_TEMP/draft-validation-verification.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("examples/python-service/.devops-stack/draft-validation-runs") / os.environ["RUN_ID"]
          release = json.loads((root / "release-validation.json").read_text())
          artifact = json.loads((root / "artifact.json").read_text())
          verification = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "draft-validation-verification.json"
              ).read_text()
          )
          assert release["downloadedFromGitHub"] is True, release
          assert release["githubArtifactAttestationsVerified"] is True, release
          assert release["workingTreeClean"] is True, release
          assert release["sourceCommit"] == os.environ["GITHUB_SHA"], release
          assert release["tagCommit"] == os.environ["GITHUB_SHA"], release
          assert artifact["buildInvocationCount"] == 1, artifact
          assert verification["passed"] is True, verification
          assert verification["bundleVerification"]["executionSucceeded"] is True, verification
          assert (
              verification["bundleVerification"]["artifactDigest"]
              == artifact["manifestDigest"]
          ), verification
          PY

      - name: Retry exact owned-resource cleanup
        if: ${{ always() }}
        run: |
          run_directory="examples/python-service/.devops-stack/draft-validation-runs/${RUN_ID:-}"
          if [[ -n "${RUN_ID:-}" && -d "$run_directory" ]]; then
            devops-stack execution cleanup \
              --project examples/python-service \
              --run "$RUN_ID" \
              --output .devops-stack/draft-validation-runs \
              --json
          fi

      - name: Upload draft-validation evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-validation-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            examples/python-service/.devops-stack/draft-validation-runs/${{ env.RUN_ID }}
            ${{ runner.temp }}/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean Docker build cache and report disk usage
        if: ${{ always() }}
        run: |
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          docker system df

  verify-draft:
    name: Reverify and isolated-install the draft
    needs:
      - build-release
      - stage-draft
      - validate-draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - name: Check out the release tag without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/devops-stack-tool-archives
          key: execution-tools-${{ runner.os }}-amd64-v1-kind-0.33.0-kubectl-1.36.4-kubeconform-0.8.0-syft-1.51.1-trivy-0.74.0-gh-2.95.0

      - name: Install the checksum-pinned GitHub CLI bundle
        run: |
          scripts/install-kind-e2e-tools.sh \
            "$RUNNER_TEMP/devops-stack-tools" \
            "$RUNNER_TEMP/devops-stack-tool-archives"
          echo "$RUNNER_TEMP/devops-stack-tools" >> "$GITHUB_PATH"

      - name: Download the immutable comparison set
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ github.ref_name }}
          path: expected-assets

      - name: Freshly download and byte-verify the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .devops-stack/final-draft-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .devops-stack/final-draft-assets
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def inventory(directory):
              entries = tuple(directory.iterdir())
              assert len(entries) == 11, entries
              assert all(path.is_file() and not path.is_symlink() for path in entries), entries
              return {path.name: sha256(path.read_bytes()).hexdigest() for path in entries}

          expected = inventory(Path("expected-assets"))
          downloaded = inventory(Path(".devops-stack/final-draft-assets"))
          assert expected == downloaded, (expected, downloaded)
          PY
          for asset in .devops-stack/final-draft-assets/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --format json > /dev/null
          done
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets \
            > "$RUNNER_TEMP/final-draft.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "final-draft.json").read_text()
          )
          assert release["tagName"] == os.environ["GITHUB_REF_NAME"], release
          assert release["isDraft"] is True, release
          assert release["isPrerelease"] is False, release
          assert release["publishedAt"] is None, release
          assert {asset["name"] for asset in release["assets"]} == {
              path.name for path in Path("expected-assets").iterdir()
          }, release
          PY

      - name: Isolated-install and fully verify both draft distributions
        run: |
          python scripts/verify-release-distributions.py \
            .devops-stack/final-draft-assets \
            "$RELEASE_VERSION" \
            "$GITHUB_SHA" \
            > "$RUNNER_TEMP/draft-install-verification.json"

      - name: Upload draft-verification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-verification-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.json
          if-no-files-found: warn
          retention-days: 30

  publish-github:
    name: Reverify unchanged bytes and publish the draft
    needs:
      - verify-draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out the release tag without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/devops-stack-tool-archives
          key: execution-tools-${{ runner.os }}-amd64-v1-kind-0.33.0-kubectl-1.36.4-kubeconform-0.8.0-syft-1.51.1-trivy-0.74.0-gh-2.95.0

      - name: Install the checksum-pinned GitHub CLI bundle
        run: |
          scripts/install-kind-e2e-tools.sh \
            "$RUNNER_TEMP/devops-stack-tools" \
            "$RUNNER_TEMP/devops-stack-tool-archives"
          echo "$RUNNER_TEMP/devops-stack-tools" >> "$GITHUB_PATH"

      - name: Download the immutable comparison set
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-${{ github.ref_name }}
          path: expected-assets

      - name: Reverify the exact candidate and publish only if still a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets \
            > "$RUNNER_TEMP/pre-publication-release.json"
          release_state=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pre-publication-release.json").read_text()
          )
          assert release["tagName"] == os.environ["GITHUB_REF_NAME"], release
          assert release["isPrerelease"] is False, release
          if release["isDraft"]:
              assert release["publishedAt"] is None, release
              print("draft")
          else:
              assert release["publishedAt"] is not None, release
              print("published")
          PY
          )
          mkdir -p .devops-stack/publication-candidate
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .devops-stack/publication-candidate
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def inventory(directory):
              entries = tuple(directory.iterdir())
              assert len(entries) == 11, entries
              assert all(path.is_file() and not path.is_symlink() for path in entries), entries
              return {path.name: sha256(path.read_bytes()).hexdigest() for path in entries}

          expected = inventory(Path("expected-assets"))
          candidate = inventory(Path(".devops-stack/publication-candidate"))
          assert expected == candidate, (expected, candidate)
          PY
          for asset in .devops-stack/publication-candidate/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --format json > /dev/null
          done
          if [[ "$release_state" == "draft" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft=false \
              --latest
          fi
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets \
            > "$RUNNER_TEMP/published-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "published-release.json").read_text()
          )
          assert release["tagName"] == os.environ["GITHUB_REF_NAME"], release
          assert release["isDraft"] is False, release
          assert release["isPrerelease"] is False, release
          assert release["publishedAt"] is not None, release
          assert {asset["name"] for asset in release["assets"]} == {
              path.name for path in Path("expected-assets").iterdir()
          }, release
          PY

      - name: Upload publication diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.json
          if-no-files-found: warn
          retention-days: 30

  post-publication:
    name: Freshly download and verify the public release
    needs:
      - build-release
      - publish-github
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
    steps:
      - name: Check out the release tag without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore checksum-pinned execution tool archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
