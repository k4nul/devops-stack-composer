[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-stack-composer"
version = "0.2.1"
description = "Compose Docker, Jenkins, and Kubernetes templates from one declarative contract"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "jsonschema>=3.2,<5",
  "PyYAML>=5.4,<7",
]
authors = [
  {name = "k4nul"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
devops-stack = "devops_stack_composer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/devops-stack-composer" = ["templates.lock.json"]
"share/devops-stack-composer/schemas" = ["schemas/*.json"]
